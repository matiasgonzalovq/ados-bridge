name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # pnpm 12.6.0 is the version the pnpm-lock.yaml in this repo was produced with.
      # pnpm/action-setup v6
      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
        with:
          version: 12.6.0

      # Node 24 LTS satisfies engines.node (>=20).
      # actions/setup-node v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: pnpm

      # --ignore-scripts: pnpm 12 fails with ERR_PNPM_IGNORED_BUILDS otherwise,
      # because esbuild's build script is not allowlisted in this repository.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run validation
        run: pnpm run validate
